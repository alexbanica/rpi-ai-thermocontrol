name: CI and Forgejo Publish

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-beta[1-9][0-9]*'

concurrency:
  group: publish-${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  Lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: Install development dependencies
        run: python -m pip install -r requirements.dev.txt
      - name: Run ruff
        run: ruff check .

  Tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: Install development dependencies
        run: python -m pip install -r requirements.dev.txt
      - name: Run tests
        run: python -m pytest

  publish_forgejo_package:
    name: Publish Forgejo Package
    runs-on: ubuntu-latest
    needs:
      - Lint
      - Tests
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install publish tooling
        run: python -m pip install build setuptools twine

      - name: Derive package version from release tag
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF#refs/tags/}"

          if [[ "$TAG_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-beta([1-9][0-9]*))?$ ]]; then
            RELEASE_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            if [[ -n "${BASH_REMATCH[4]}" ]]; then
              PACKAGE_VERSION="${RELEASE_VERSION}b${BASH_REMATCH[5]}"
            else
              PACKAGE_VERSION="$RELEASE_VERSION"
            fi
          else
            echo "Tag '$TAG_NAME' must be MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-betaN." >&2
            exit 1
          fi

          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Build and verify distributions
        run: |
          set -euo pipefail

          rm -rf dist
          RELEASE_VERSION="$PACKAGE_VERSION" python -m build --outdir dist

          shopt -s nullglob
          SDISTS=(dist/*.tar.gz)
          WHEELS=(dist/*.whl)

          if (( ${#SDISTS[@]} != 1 )); then
            echo "Expected exactly one source distribution, got ${#SDISTS[@]}." >&2
            exit 1
          fi

          if (( ${#WHEELS[@]} != 1 )); then
            echo "Expected exactly one wheel distribution, got ${#WHEELS[@]}." >&2
            exit 1
          fi

          python -m twine check dist/*

      - name: Publish package
        env:
          TWINE_USERNAME: ${{ secrets.FORGEJO_PACKAGE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
        run: |
          python -m twine upload --repository-url "https://forgejo.alexlab.nl/api/packages/public/pypi" dist/*

      - name: Verify anonymous install
        run: |
          set -euo pipefail

          unset TWINE_USERNAME
          unset TWINE_PASSWORD

          mkdir -p /tmp/forgejo-publish-verify

          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/forgejo-publish-verify/*

            if python -m pip download --no-deps --only-binary :all: --no-input --index-url "https://forgejo.alexlab.nl/api/packages/public/pypi/simple" "rpi-ai-thermocontrol==${PACKAGE_VERSION}" -d /tmp/forgejo-publish-verify; then
              echo "Verified anonymous install for rpi-ai-thermocontrol==$PACKAGE_VERSION."
              break
            fi

            if [[ "$attempt" == "5" ]]; then
              echo "Anonymous install verification failed after 5 attempts." >&2
              exit 1
            fi

            sleep 5
          done
