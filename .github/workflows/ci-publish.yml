name: CI and Forgejo Publish

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: publish-${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  Lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: Install development dependencies
        run: python -m pip install -r requirements.dev.txt
      - name: Run ruff
        run: ruff check .

  Tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: Install development dependencies
        run: python -m pip install -r requirements.dev.txt
      - name: Run tests
        run: python -m pytest

  publish_forgejo_package:
    name: Publish Forgejo Package
    runs-on: ubuntu-latest
    needs:
      - Lint
      - Tests
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install publish tooling
        run: python -m pip install build twine

      - name: Validate tag and package version
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF#refs/tags/}"

          if [[ ! "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG_NAME' is not in MAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          PACKAGE_VERSION=$(python -c "import pathlib, re, sys; text = pathlib.Path('setup.py').read_text(); match = re.search(r\"version\\s*=\\s*['\\\"]([^'\\\"]+)['\\\"]\", text); print(match.group(1) if match else sys.exit('Unable to read package version from setup.py'))")

          if [[ "$TAG_NAME" != "$PACKAGE_VERSION" ]]; then
            echo "Tag '$TAG_NAME' does not match package version '$PACKAGE_VERSION'." >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag target commit $GITHUB_SHA is not on main." >&2
            exit 1
          fi

      - name: Build and verify distributions
        run: |
          set -euo pipefail

          rm -rf dist
          python -m build --outdir dist

          shopt -s nullglob
          SDISTS=(dist/*.tar.gz)
          WHEELS=(dist/*.whl)

          if (( ${#SDISTS[@]} != 1 )); then
            echo "Expected exactly one source distribution, got ${#SDISTS[@]}." >&2
            exit 1
          fi

          if (( ${#WHEELS[@]} != 1 )); then
            echo "Expected exactly one wheel distribution, got ${#WHEELS[@]}." >&2
            exit 1
          fi

          python -m twine check dist/*

      - name: Publish package
        env:
          TWINE_USERNAME: ${{ secrets.FORGEJO_PACKAGE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
        run: |
          python -m twine upload --repository-url "https://forgejo.alexlab.nl/api/packages/public/pypi" dist/*

      - name: Verify anonymous install
        run: |
          set -euo pipefail

          unset TWINE_USERNAME
          unset TWINE_PASSWORD

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          mkdir -p /tmp/forgejo-publish-verify

          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/forgejo-publish-verify/*

            if python -m pip download --no-deps --no-binary :all: --no-input --index-url "https://forgejo.alexlab.nl/api/packages/public/pypi/simple" "rpi-ai-thermocontrol==${TAG_NAME}" -d /tmp/forgejo-publish-verify; then
              echo "Verified anonymous install for rpi-ai-thermocontrol==$TAG_NAME."
              break
            fi

            if [[ "$attempt" == "5" ]]; then
              echo "Anonymous install verification failed after 5 attempts." >&2
              exit 1
            fi

            sleep 5
          done
